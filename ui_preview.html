<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医疗问答助手 UI 预览</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-muted: #f2f4f7;
      --surface-hover: #eef6f7;
      --border: #d8dde5;
      --text: #182230;
      --muted: #667085;
      --subtle: #98a2b3;
      --primary: #087f8c;
      --primary-pressed: #066a74;
      --accent: #067647;
      --warning-bg: #fffaeb;
      --warning-border: #fedf89;
      --warning-text: #93370d;
      --shadow-soft: 0 18px 44px rgba(16, 24, 40, 0.08);
      --radius: 14px;
      --rail-width: clamp(224px, 19vw, 280px);
      --content-width: min(1120px, 100%);
      --composer-height: 166px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .chat-app {
      height: 100dvh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
      overflow: hidden;
    }

    .history-rail {
      background: #f0f2f5;
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .rail-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 4px;
    }

    .brand-symbol {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
    }

    .rail-brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
    }

    .rail-brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .new-chat {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .new-chat:hover {
      background: var(--surface-hover);
      border-color: #9dd6dc;
    }

    .rail-section-title {
      margin: 8px 4px 4px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .history-list {
      display: grid;
      gap: 6px;
    }

    .history-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 46px;
      align-items: center;
      gap: 4px;
      border-radius: 9px;
    }

    .history-item {
      border: 0;
      text-align: left;
      min-height: 40px;
      border-radius: 9px;
      padding: 8px 10px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
    }

    .history-entry.active,
    .history-entry:hover,
    .history-item:hover {
      background: #e7eaee;
    }

    .history-delete {
      width: 42px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .history-delete:hover {
      background: #fff1f3;
      color: #c01048;
    }

    .rail-foot {
      margin-top: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.65);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .chat-main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    .chat-header {
      min-height: 64px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(247, 247, 248, 0.92);
      border-bottom: 1px solid rgba(216, 221, 229, 0.75);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .header-title {
      min-width: 0;
    }

    .header-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .header-title p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-pill {
      min-height: 38px;
      border-radius: 999px;
      padding: 0 14px;
      border: 1px solid rgba(24, 34, 48, 0.12);
      background: var(--surface);
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .status-chip {
      color: #344054;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(6, 118, 71, 0.10);
    }

    .index-progress {
      width: min(360px, 100%);
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .index-progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7eaee;
    }

    .index-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 220ms ease;
    }

    .index-progress-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .plain-button:hover {
      border-color: rgba(8, 127, 140, 0.28);
      background: #fbfdfe;
    }

    .conversation {
      width: 100%;
      margin: 0 auto;
      padding: clamp(22px, 4vh, 38px) clamp(18px, 3vw, 30px) 0;
      padding-bottom: calc(var(--composer-height) + 28px);
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-padding-bottom: var(--composer-height);
    }

    .welcome {
      width: min(var(--content-width), 100%);
      margin-inline: auto;
      text-align: center;
      padding: clamp(12px, 4vh, 34px) 0 8px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 750;
    }

    .welcome p {
      max-width: 620px;
      margin: 10px auto 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .quick-prompts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: min(var(--content-width), 100%);
      margin: 4px auto 8px;
    }

    .prompt-card {
      min-height: 56px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      line-height: 1.45;
      transition: border-color 180ms ease, background 180ms ease;
    }

    .prompt-card:hover {
      border-color: #9dd6dc;
      background: var(--surface-hover);
    }

    .message-row {
      width: min(var(--content-width), 100%);
      margin-inline: auto;
      display: flex;
      gap: 12px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-muted);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    .avatar.assistant {
      background: #e6f7f8;
      color: var(--primary);
    }

    .message {
      border-radius: 16px;
      padding: 14px 16px;
      line-height: 1.7;
      font-size: 15px;
    }

    .message.user {
      max-width: min(680px, 78%);
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      width: min(860px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.05);
    }

    .message p {
      margin: 0 0 10px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .answer-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .answer-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .speak-button {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--muted);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .speak-button:hover,
    .speak-button.playing {
      border-color: #9dd6dc;
      background: #e6f7f8;
      color: var(--primary);
    }

    .answer-label {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .answer-label.local {
      background: #ecfdf3;
      color: var(--accent);
    }

    .safety-note {
      margin-top: 12px;
      border: 1px solid var(--warning-border);
      background: var(--warning-bg);
      color: var(--warning-text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.65;
    }

    details.evidence {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    details.evidence summary {
      list-style: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    details.evidence summary::-webkit-details-marker {
      display: none;
    }

    .evidence-list {
      display: grid;
      gap: 9px;
      margin-top: 8px;
    }

    .evidence-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fbfcfd;
    }

    .evidence-item strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .evidence-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .composer-wrap {
      position: fixed;
      left: var(--rail-width);
      right: 0;
      bottom: 0;
      padding: 18px clamp(14px, 3vw, 26px) calc(18px + var(--safe-bottom));
      background: linear-gradient(to top, var(--bg) 72%, rgba(247, 247, 248, 0));
    }

    .composer {
      width: min(var(--content-width), 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      padding: 10px;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 8px;
    }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      background: var(--surface-muted);
    }

    .mode-button {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .mode-button.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.08);
    }

    .mode-button:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .settings-details {
      position: relative;
    }

    .settings-details summary {
      list-style: none;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .settings-details summary::-webkit-details-marker {
      display: none;
    }

    .settings-popover {
      position: absolute;
      right: 0;
      bottom: 46px;
      width: 290px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      padding: 14px;
      z-index: 20;
    }

    .setting-field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .setting-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .setting-field input,
    .setting-field select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 10px;
      color: var(--text);
      background: var(--surface);
    }

    .input-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: end;
    }

    .round-button,
    .send-button {
      width: 46px;
      min-width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text);
      display: grid;
      place-items: center;
      font-weight: 800;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .round-button:hover {
      background: var(--surface-hover);
      border-color: #9dd6dc;
    }

    .send-button {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .send-button:hover {
      background: var(--primary-pressed);
    }

    .send-button[disabled] {
      opacity: 0.72;
      cursor: wait;
    }

    .round-button.listening {
      border-color: #8ed1d9;
      background: #e6f7f8;
      color: var(--primary);
    }

    .message.loading {
      color: var(--muted);
    }

    .loading-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .loading-content p {
      margin: 0;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 2px solid #d8dde5;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .history-empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 8px 10px;
    }

    .mic-icon,
    .send-icon {
      width: 21px;
      height: 21px;
      display: block;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .query-box {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      resize: vertical;
      border: 0;
      outline: none;
      padding: 11px 4px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
    }

    .composer-hint {
      padding: 8px 6px 0 52px;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 940px) {
      :root {
        --composer-height: 176px;
      }

      .chat-app {
        grid-template-columns: 1fr;
      }

      .history-rail {
        display: none;
      }

      .composer-wrap {
        left: 0;
      }

      .chat-header {
        padding-inline: 16px;
      }
    }

    @media (max-width: 720px) {
      :root {
        --composer-height: 214px;
      }

      .chat-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
      }

      .conversation {
        padding-inline: 14px;
        padding-bottom: calc(var(--composer-height) + 18px);
      }

      .welcome,
      .quick-prompts,
      .message-row {
        width: 100%;
      }

      .welcome {
        text-align: left;
        padding-top: 10px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .quick-prompts {
        grid-template-columns: 1fr;
      }

      .message.user {
        max-width: calc(100vw - 74px);
      }

      .message.assistant {
        width: 100%;
      }

      .message {
        font-size: 14px;
      }

      .composer-wrap {
        padding: 12px 10px 14px;
      }

      .mode-row {
        align-items: stretch;
        flex-direction: column;
      }

      .mode-switch {
        width: 100%;
        overflow-x: auto;
      }

      .settings-popover {
        width: min(290px, calc(100vw - 32px));
        right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <aside class="history-rail" aria-label="历史对话">
      <div class="rail-brand">
        <div class="brand-symbol" aria-hidden="true">医</div>
        <div>
          <h1>医疗问答助手</h1>
          <p>课程演示版</p>
        </div>
      </div>

      <button class="new-chat">新建咨询</button>

      <div>
        <p class="rail-section-title">最近对话</p>
        <div class="history-list">
          <div class="history-empty">暂无历史对话</div>
        </div>
      </div>

      <div class="rail-foot">
        本系统用于自然语言处理课程展示。医疗建议仅供参考，不能替代线下医生诊断。
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="header-title">
          <h2>医疗问答助手</h2>
          <p>默认使用本地检索模式，必要时可切换在线问答或混合模式。</p>
        </div>
        <div class="index-progress" role="progressbar" aria-label="本地索引加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="index-progress-track" aria-hidden="true">
            <div class="index-progress-fill"></div>
          </div>
          <span class="index-progress-text">本地索引等待加载</span>
        </div>
        <div class="header-actions">
          <span class="header-pill status-chip">
            <span class="status-dot" aria-hidden="true"></span>
            正在检查服务状态
          </span>
          <button class="header-pill plain-button">API 设置</button>
        </div>
      </header>

      <section class="conversation" aria-label="医疗问答聊天内容">
        <div class="welcome" data-empty-state="true">
          <h1>请描述你的健康问题</h1>
          <p>可以输入症状、持续时间、既往病史或检查结果。系统会先用本地医患问答库检索相似问题，并给出可追溯的参考回答。</p>
        </div>

        <div class="quick-prompts" aria-label="常用问题">
          <button class="prompt-card">最近拉肚子并伴随腹痛，应该怎么办？</button>
          <button class="prompt-card">高血压患者日常饮食需要注意什么？</button>
          <button class="prompt-card">胃痛反酸持续几天，需要去医院吗？</button>
          <button class="prompt-card">咳嗽、发热时如何判断是否需要就诊？</button>
        </div>

        <template id="evidence-template">
          <details class="evidence">
            <summary>查看检索依据</summary>
            <div class="evidence-list"></div>
          </details>
        </template>
      </section>

      <div class="composer-wrap">
        <section class="composer" aria-label="问题输入区">
          <div class="mode-row">
            <div class="mode-switch" role="tablist" aria-label="回答模式">
              <button class="mode-button active" data-mode="local" role="tab" aria-selected="true">本地检索模式</button>
              <button class="mode-button" data-mode="online" role="tab" aria-selected="false">在线问答</button>
              <button class="mode-button" data-mode="hybrid" role="tab" aria-selected="false">混合模式</button>
            </div>

            <details class="settings-details">
              <summary>设置</summary>
              <div class="settings-popover">
                <div class="setting-field">
                  <label for="data-scope">数据范围</label>
                  <select id="data-scope">
                    <option value="default" selected>内科 + 外科</option>
                    <option value="internal">仅内科</option>
                    <option value="surgical">仅外科</option>
                    <option value="pediatric">儿科</option>
                    <option value="gynecology">妇产科</option>
                    <option value="andriatria">男科</option>
                    <option value="oncology">肿瘤科</option>
                    <option value="all">全部科室</option>
                  </select>
                </div>
                <div class="setting-field">
                  <label for="top-k">Top-K 召回数量</label>
                  <input id="top-k" value="3" />
                </div>
                <div class="setting-field">
                  <label for="threshold">相似度阈值</label>
                  <input id="threshold" value="0.05" />
                </div>
                <div class="setting-field">
                  <label for="api-state">在线模式状态</label>
                  <input id="api-state" value="千问 API Key 待配置" />
                </div>
              </div>
            </details>
          </div>

          <div class="input-row">
            <button class="round-button" aria-label="语音输入">
              <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" />
                <path d="M5 11a7 7 0 0 0 14 0" />
                <path d="M12 18v3" />
                <path d="M8 21h8" />
              </svg>
            </button>
            <textarea class="query-box" aria-label="输入医疗问题" placeholder="输入症状、病史、检查结果，或点击左侧语音输入"></textarea>
            <button class="send-button" aria-label="发送问题">
              <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5" />
                <path d="M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
          <div class="composer-hint">
            在线问答会调用千问 API；本地检索不会上传问题。语音输入会先转成文字，确认后再发送。
          </div>
        </section>
      </div>
    </main>
  </div>
  <script>
    const modeLabels = {
      local: "本地检索模式",
      online: "在线问答",
      hybrid: "混合模式",
    };

    const departmentScopes = {
      default: ["IM_内科", "Surgical_外科"],
      internal: ["IM_内科"],
      surgical: ["Surgical_外科"],
      pediatric: ["Pediatric_儿科"],
      gynecology: ["OAGD_妇产科"],
      andriatria: ["Andriatria_男科"],
      oncology: ["Oncology_肿瘤科"],
      all: ["IM_内科", "Surgical_外科", "OAGD_妇产科", "Pediatric_儿科", "Andriatria_男科", "Oncology_肿瘤科"],
    };

    let currentMode = "local";
    let currentConversationId = "";
    let currentHealth = null;
    let currentRecognition = null;
    let activeSpeechButton = null;
    let speechDraft = "";
    let isSending = false;

    const historyKey = "medical_qa_conversations";
    const conversation = document.querySelector(".conversation");
    const queryBox = document.querySelector(".query-box");
    const sendButton = document.querySelector(".send-button");
    const micButton = document.querySelector(".round-button");
    const modeButtons = document.querySelectorAll(".mode-button");
    const promptCards = document.querySelectorAll(".prompt-card");
    const statusChip = document.querySelector(".status-chip");
    const apiButton = document.querySelector(".plain-button");
    const historyList = document.querySelector(".history-list");
    const newChatButton = document.querySelector(".new-chat");
    const apiStateInput = document.querySelector("#api-state");
    const dataScopeSelect = document.querySelector("#data-scope");
    const indexProgress = document.querySelector(".index-progress");
    const indexProgressFill = document.querySelector(".index-progress-fill");
    const indexProgressText = document.querySelector(".index-progress-text");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    micButton.setAttribute("aria-pressed", "false");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function paragraphHtml(text) {
      return String(text || "暂时没有生成回答。")
        .split(/\n+/)
        .filter(Boolean)
        .map((line) => `<p>${escapeHtml(line)}</p>`)
        .join("");
    }

    function scrollConversation() {
      requestAnimationFrame(() => {
        conversation.scrollTop = conversation.scrollHeight;
      });
    }

    function setStatus(text, onlineReady) {
      const dotColor = onlineReady === false ? "#d92d20" : "var(--accent)";
      statusChip.innerHTML = `<span class="status-dot" style="background:${dotColor}" aria-hidden="true"></span>${escapeHtml(text)}`;
    }

    function updateLocalProgress(payload) {
      const progress = payload?.local_progress || {};
      const percent = Math.max(0, Math.min(Number(progress.percent || 0), 100));
      const stage = progress.stage || "本地索引等待加载";
      if (indexProgress) {
        indexProgress.setAttribute("aria-valuenow", String(Math.round(percent)));
      }
      if (indexProgressFill) {
        indexProgressFill.style.width = `${percent}%`;
      }
      if (indexProgressText) {
        indexProgressText.textContent = `${stage} · ${Math.round(percent)}%`;
      }
    }

    function sanitizeSpeechText(text) {
      return String(text || "")
        .replace(/\s+/g, " ")
        .replace(/Top-\d+\s*召回/g, "")
        .trim();
    }

    function resetSpeechButton(button) {
      if (!button) {
        return;
      }
      button.classList.remove("playing");
      button.textContent = "播放回答";
      if (activeSpeechButton === button) {
        activeSpeechButton = null;
      }
    }

    function stopAnswerSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      resetSpeechButton(activeSpeechButton);
    }

    function speakAnswer(text, button) {
      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        button.textContent = "当前浏览器不支持播报";
        return;
      }
      if (activeSpeechButton === button) {
        stopAnswerSpeech();
        return;
      }

      stopAnswerSpeech();
      const utterance = new SpeechSynthesisUtterance(sanitizeSpeechText(text));
      utterance.lang = "zh-CN";
      utterance.rate = 1;
      utterance.onend = () => resetSpeechButton(button);
      utterance.onerror = () => resetSpeechButton(button);
      activeSpeechButton = button;
      button.classList.add("playing");
      button.textContent = "停止播放";
      window.speechSynthesis.speak(utterance);
    }

    function bindSpeakButton(row, text) {
      const button = row.querySelector(".speak-button");
      if (button) {
        button.addEventListener("click", () => speakAnswer(text, button));
      }
    }

    function modeNeedsLocal(mode) {
      return mode === "local" || mode === "hybrid";
    }

    function localIndexReady() {
      return currentHealth?.local_ready === true;
    }

    function localIndexLoading() {
      return currentHealth?.local_loading === true;
    }

    function selectModeButton(button) {
      if (!button || button.disabled) {
        return;
      }
      currentMode = button.dataset.mode || "local";
      modeButtons.forEach((item) => {
        const isActive = item === button;
        item.classList.toggle("active", isActive);
        item.setAttribute("aria-selected", String(isActive));
      });
    }

    function updateModeAvailability() {
      const localReady = localIndexReady();
      const loadingMessage = localIndexLoading() ? "本地索引加载中" : "本地索引尚未加载完成";
      modeButtons.forEach((button) => {
        const disabled = modeNeedsLocal(button.dataset.mode) && !localReady;
        button.disabled = disabled;
        button.title = disabled ? loadingMessage : "";
      });

      if (modeNeedsLocal(currentMode) && !localReady) {
        const onlineButton = Array.from(modeButtons).find((button) => button.dataset.mode === "online");
        selectModeButton(onlineButton);
      }
    }

    function readHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey) || "[]");
      } catch {
        return [];
      }
    }

    function writeHistory(items) {
      localStorage.setItem(historyKey, JSON.stringify(items.slice(0, 8)));
    }

    function createConversationId() {
      return `c-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function upsertConversation(item) {
      const items = readHistory().filter((existing) => existing.id !== item.id);
      items.unshift(item);
      writeHistory(items);
      renderHistory();
    }

    function getActiveConversation() {
      return readHistory().find((item) => item.id === currentConversationId) || null;
    }

    function saveConversationMessage(role, data) {
      let item = getActiveConversation();
      if (!item) {
        currentConversationId = createConversationId();
        item = {
          id: currentConversationId,
          title: role === "user" ? data.text : "新的医疗咨询",
          messages: [],
          updatedAt: Date.now(),
        };
      }
      item.messages = Array.isArray(item.messages) ? item.messages : [];
      item.messages.push({ role, ...data });
      if (role === "user" && item.messages.filter((message) => message.role === "user").length === 1) {
        item.title = data.text.slice(0, 32);
      }
      item.updatedAt = Date.now();
      upsertConversation(item);
    }

    function clearRenderedMessages() {
      conversation.querySelectorAll(".message-row").forEach((row) => row.remove());
    }

    function startNewConversation() {
      currentConversationId = "";
      clearRenderedMessages();
      queryBox.value = "";
      renderHistory();
      queryBox.focus();
    }

    function deleteConversation(id, event) {
      if (event) {
        event.stopPropagation();
      }
      const items = readHistory().filter((item) => item.id !== id);
      writeHistory(items);
      if (currentConversationId === id) {
        startNewConversation();
      } else {
        renderHistory();
      }
    }

    function loadConversation(id) {
      const item = readHistory().find((entry) => entry.id === id);
      if (!item) {
        return;
      }
      currentConversationId = id;
      clearRenderedMessages();
      item.messages.forEach((message) => {
        if (message.role === "user") {
          renderUserMessage(message.text);
        }
        if (message.role === "assistant") {
          renderAssistantMessage(message.payload);
        }
      });
      renderHistory();
    }

    function renderHistory() {
      const items = readHistory();
      if (!items.length) {
        historyList.innerHTML = `<div class="history-empty">暂无历史对话</div>`;
        return;
      }
      historyList.innerHTML = items.map((item) => `
        <div class="history-entry${item.id === currentConversationId ? " active" : ""}">
          <button class="history-item" data-id="${escapeHtml(item.id)}">
            ${escapeHtml(item.title || "未命名咨询")}
          </button>
          <button class="history-delete" data-id="${escapeHtml(item.id)}" aria-label="删除历史对话">删除</button>
        </div>
      `).join("");
      historyList.querySelectorAll(".history-item").forEach((button) => {
        button.addEventListener("click", () => loadConversation(button.dataset.id || ""));
      });
      historyList.querySelectorAll(".history-delete").forEach((button) => {
        button.addEventListener("click", (event) => deleteConversation(button.dataset.id || "", event));
      });
    }

    function renderUserMessage(text) {
      const row = document.createElement("div");
      row.className = "message-row user";
      row.innerHTML = `<div class="message user">${escapeHtml(text)}</div>`;
      conversation.appendChild(row);
      scrollConversation();
    }

    function renderAssistantLoading() {
      const row = document.createElement("div");
      row.className = "message-row";
      row.innerHTML = `
        <div class="avatar assistant" aria-hidden="true">医</div>
        <article class="message assistant loading">
          <div class="loading-content">
            <span class="loading-spinner" aria-hidden="true"></span>
            <p>正在生成回答，请稍候...</p>
          </div>
        </article>
      `;
      conversation.appendChild(row);
      scrollConversation();
      return row;
    }

    function renderAssistantMessage(payload) {
      const evidence = Array.isArray(payload.evidence) ? payload.evidence : [];
      const mode = payload.mode || currentMode;
      const modeClass = mode === "local" ? " local" : "";
      const labels = [
        `<span class="answer-label${modeClass}">${escapeHtml(modeLabels[mode] || "回答模式")}</span>`,
      ];

      if (evidence.length > 0) {
        labels.push(`<span class="answer-label">Top-${evidence.length} 召回</span>`);
      }

      const evidenceHtml = evidence.length > 0
        ? `
          <details class="evidence">
            <summary>查看检索依据</summary>
            <div class="evidence-list">
              ${evidence.map((item) => `
                <div class="evidence-item">
                  <strong>Top ${escapeHtml(item.rank)} · ${escapeHtml(item.title)}</strong>
                  <span>来源：${escapeHtml(item.source || "本地数据")} · ${escapeHtml(item.department || "未知科室")} · 相似度 ${escapeHtml(item.score)}</span>
                </div>
              `).join("")}
            </div>
          </details>
        `
        : "";

      const row = document.createElement("div");
      row.className = "message-row";
      row.innerHTML = `
        <div class="avatar assistant" aria-hidden="true">医</div>
        <article class="message assistant">
          ${paragraphHtml(payload.answer)}
          <div class="answer-actions">
            <button class="speak-button" type="button" aria-label="播放回答">播放回答</button>
          </div>
          <div class="answer-labels">${labels.join("")}</div>
          ${payload.warning ? `<div class="safety-note">${escapeHtml(payload.warning)}</div>` : ""}
          ${evidenceHtml}
        </article>
      `;
      conversation.appendChild(row);
      bindSpeakButton(row, payload.answer);
      scrollConversation();
    }

    function renderAssistantError(message) {
      const payload = {
        mode: currentMode,
        answer: message,
        warning: "请检查本地服务、网络或 API Key 配置。紧急症状请优先线下就医。",
        evidence: [],
      };
      renderAssistantMessage(payload);
      saveConversationMessage("assistant", { payload });
    }

    function numberSetting(id, fallback) {
      const value = Number(document.getElementById(id)?.value);
      return Number.isFinite(value) ? value : fallback;
    }

    async function refreshHealth() {
      try {
        const response = await fetch('/api/health');
        const payload = await response.json();
        currentHealth = payload;
        updateLocalProgress(payload);
        const onlineText = payload.online_ready ? "在线 API 可用" : "在线 API 未配置";
        const localText = payload.local_ready
          ? "本地索引已就绪"
          : payload.local_loading
            ? "本地索引加载中"
            : payload.local_error
              ? "本地索引加载失败"
              : "本地索引尚未加载完成";
        const modelText = payload.online_model ? `当前模型：${payload.online_model}` : "当前模型：未读取";
        setStatus(`${localText} · ${onlineText}`, payload.online_ready);
        if (apiStateInput) {
          apiStateInput.value = `${onlineText} · ${modelText} · ${localText}`;
        }
        updateModeAvailability();
      } catch {
        currentHealth = null;
        updateLocalProgress({ local_progress: { percent: 0, stage: "本地服务未连接" } });
        setStatus("本地服务未连接", false);
        if (apiStateInput) {
          apiStateInput.value = "服务未连接";
        }
        updateModeAvailability();
      }
    }

    async function applyDepartmentScope(scope) {
      if (!departmentScopes[scope]) {
        return;
      }
      stopAnswerSpeech();
      setStatus("正在切换数据范围并重建索引", currentHealth?.online_ready);
      updateLocalProgress({ local_progress: { percent: 5, stage: "准备切换数据范围" } });
      try {
        const response = await fetch('/api/config', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scope }),
        });
        const payload = await response.json();
        if (!response.ok || payload.error) {
          renderAssistantError(payload.error || "数据范围切换失败，请稍后重试。");
          return;
        }
        currentHealth = payload;
        updateLocalProgress(payload);
        updateModeAvailability();
      } catch {
        renderAssistantError("无法切换数据范围，请确认本地服务仍在运行。");
      }
    }

    async function sendQuestion(questionOverride) {
      const question = String(questionOverride || queryBox.value || "").trim();
      if (!question || isSending) {
        queryBox.focus();
        return;
      }
      if (modeNeedsLocal(currentMode) && !localIndexReady()) {
        renderAssistantError("本地索引尚未加载完成，请稍候再使用本地检索或混合模式，也可以先切换到在线问答。");
        refreshHealth();
        queryBox.focus();
        return;
      }

      isSending = true;
      sendButton.disabled = true;
      queryBox.value = "";
      renderUserMessage(question);
      saveConversationMessage("user", { text: question });
      const loadingRow = renderAssistantLoading();

      try {
        const response = await fetch('/api/ask', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            mode: currentMode,
            top_k: numberSetting("top-k", 3),
            threshold: numberSetting("threshold", 0.05),
          }),
        });
        const payload = await response.json();
        loadingRow.remove();
        if (!response.ok || payload.error) {
          renderAssistantError(payload.error || "服务返回异常，请稍后重试。");
          return;
        }
        renderAssistantMessage(payload);
        saveConversationMessage("assistant", { payload });
        refreshHealth();
      } catch {
        loadingRow.remove();
        renderAssistantError("无法连接本地医疗问答服务，请确认程序窗口仍在运行。");
      } finally {
        isSending = false;
        sendButton.disabled = false;
        queryBox.focus();
      }
    }

    function stopSpeechRecognition() {
      if (currentRecognition) {
        currentRecognition.stop();
      }
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectModeButton(button);
      });
    });

    promptCards.forEach((card) => {
      card.addEventListener("click", () => {
        queryBox.value = card.textContent.trim();
        queryBox.focus();
      });
    });

    if (dataScopeSelect) {
      dataScopeSelect.addEventListener("change", () => {
        applyDepartmentScope(dataScopeSelect.value || "default");
      });
    }

    sendButton.addEventListener("click", () => sendQuestion());
    queryBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });

    micButton.addEventListener("click", () => {
      if (currentRecognition) {
        stopSpeechRecognition();
        return;
      }
      if (!SpeechRecognition) {
        queryBox.placeholder = "当前浏览器不支持语音输入，请直接输入文字";
        queryBox.focus();
        return;
      }

      const recognition = new SpeechRecognition();
      speechDraft = queryBox.value.trim();
      currentRecognition = recognition;
      recognition.lang = "zh-CN";
      recognition.continuous = false;
      recognition.interimResults = true;
      micButton.classList.add("listening");
      micButton.setAttribute("aria-pressed", "true");
      micButton.title = "停止语音输入";

      recognition.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map((result) => result[0]?.transcript || "")
          .join("")
          .trim();
        if (transcript) {
          queryBox.value = [speechDraft, transcript].filter(Boolean).join(" ");
          queryBox.focus();
        }
      };

      recognition.onerror = () => {
        queryBox.placeholder = "语音识别失败，请检查麦克风权限或直接输入文字";
      };

      recognition.onend = () => {
        currentRecognition = null;
        micButton.classList.remove("listening");
        micButton.setAttribute("aria-pressed", "false");
        micButton.title = "语音输入";
      };

      recognition.start();
    });

    apiButton.addEventListener("click", () => {
      const model = currentHealth?.online_model || "未读取";
      const onlineText = currentHealth?.online_ready ? "在线 API 可用" : "在线 API 未配置";
      alert(`API 设置\n当前模型：${model}\n状态：${onlineText}\n配置文件：qwen_config.py`);
    });

    newChatButton.addEventListener("click", startNewConversation);

    renderHistory();
    refreshHealth();
    window.setInterval(refreshHealth, 2500);
  </script>
</body>
</html>
